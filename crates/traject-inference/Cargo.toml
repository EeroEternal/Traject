[package]
name = "traject-inference"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pluggable inference core for Traject"

[features]
default = []
# Embed CPython and call FlashInfer in-process (Linux + CUDA venv).
flashinfer = ["pyo3"]

[dependencies]
traject-core = { workspace = true }
async-trait = "0.1"
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# 0.8+: F8_E4M3 + F8_E8M0 for DeepSeek-V4 block-scaled weights
safetensors = "0.8"
memmap2 = "0.9"
# HF tokenizer.json (BPE etc.) — DeepSeek-V4-Flash and other HF models.
# fancy-regex avoids onig_sys (native) for easier cross-machine builds.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
# Parallel dense/expert matvec + multi-head attention (CPU LocalWeightRunner).
rayon = "1.10"
pyo3 = { version = "0.22", features = ["auto-initialize"], optional = true }
